server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: einvoice-gamification-poc

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 10
      batch-size: 65536
      linger-ms: 5
      compression-type: lz4
      buffer-memory: 67108864
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      group-id: einvoice-gamification
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 5000
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.vnpt.einvoice.gamification.event
        max.poll.interval.ms: 300000
        fetch.min.bytes: 1048576
        fetch.max.wait.ms: 100
    listener:
      ack-mode: BATCH
      concurrency: 12

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

app:
  kafka:
    topic: invoice-events
    dlt-topic: invoice-events.DLT
  leaderboard:
    key: einv:leaderboard
  reward:
    points-per-invoice: 10
    processed-set: "einv:processed-invoices"
    batch-marker-ttl-seconds: 604800

logging:
  level:
    com.vnpt.einvoice.gamification: INFO
